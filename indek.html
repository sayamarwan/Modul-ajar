<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Modul Ajar Generator (Deep Learning Powered)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a237e; font-size: 24px; }
        p.subtitle { text-align: center; color: #5c6bc0; margin-bottom: 30px; font-weight: 600; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .api-note { font-size: 12px; color: #d32f2f; margin-top: 5px; }
        button { background-color: #2e7d32; color: #fff; border: none; padding: 15px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #1b5e20; }
        button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #3f51b5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .output-section { margin-top: 30px; display: none; }
        .result-box { width: 100%; height: 500px; padding: 20px; border: 1px solid #c5cae9; border-radius: 6px; font-size: 15px; overflow-y: auto; background-color: #fafafa; box-sizing: border-box; font-family: 'Times New Roman', Times, serif; white-space: pre-wrap; line-height: 1.6; }
        .btn-copy { background-color: #3f51b5; margin-top: 15px; }
        .btn-copy:hover { background-color: #303f9f; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mesin AI Pembuat Modul Ajar</h1>
    <p class="subtitle">Didukung oleh Google Gemini Deep Learning API</p>

    <div class="form-group">
        <label for="apiKey">Google Gemini API Key (Wajib)</label>
        <input type="password" id="apiKey" placeholder="Masukkan API Key Anda di sini...">
        <div class="api-note">Tempelkan kode yang diawali dengan huruf AIzaSy...</div>
    </div>

    <div class="form-group">
        <label for="mapel">Mata Pelajaran</label>
        <input type="text" id="mapel" placeholder="Contoh: Ilmu Pengetahuan Alam (IPA)">
    </div>
    
    <div class="form-group">
        <label for="kelas">Fase, Kelas / Semester</label>
        <input type="text" id="kelas" placeholder="Contoh: Fase D, Kelas VII / Ganjil">
    </div>

    <div class="form-group">
        <label for="bab">Judul Bab / Topik Pembelajaran</label>
        <input type="text" id="bab" placeholder="Contoh: Bab 2 - Ekologi">
    </div>

    <div class="form-group">
        <label for="waktu">Alokasi Waktu</label>
        <input type="text" id="waktu" placeholder="Contoh: 12 JP">
    </div>

    <button id="btnGenerate" onclick="generateModul()">Mulai Pembuatan Modul (AI Berpikir...)</button>
    <div class="loader" id="loader"></div>

    <div class="output-section" id="outputSection">
        <label>Hasil Modul Ajar (Siap Pindah ke Word):</label>
        <div id="resultBox" class="result-box"></div>
        <button class="btn-copy" onclick="copyResult()">Salin Seluruh Modul ke Clipboard</button>
    </div>
</div>

<script>
    async function generateModul() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const mapel = document.getElementById('mapel').value || "[Mata Pelajaran]";
        const kelas = document.getElementById('kelas').value || "[Fase, Kelas/Semester]";
        const bab = document.getElementById('bab').value || "[Judul Bab/Topik]";
        const waktu = document.getElementById('waktu').value || "[Alokasi Waktu]";

        if (!apiKey || apiKey.length < 20) {
            alert("Harap masukkan Google Gemini API Key yang valid!");
            return;
        }

        const btn = document.getElementById('btnGenerate');
        const loader = document.getElementById('loader');
        const outputSection = document.getElementById('outputSection');
        const resultBox = document.getElementById('resultBox');

        btn.disabled = true;
        btn.innerText = "AI sedang menyusun modul... (Tunggu 10-30 detik)";
        loader.style.display = "block";
        outputSection.style.display = "none";

        const promptText = `Bertindaklah sebagai Ahli Kurikulum Merdeka dan Pendidik Profesional. Buat "Modul Ajar Deep Learning" untuk pelajaran ${mapel}, ${kelas}, materi: ${bab}, waktu ${waktu}.
        WAJIB GUNAKAN STRUKTUR INI SAMA PERSIS KATA DEMI KATA:
        
        MODUL AJAR DEEP LEARNING
        MATA PELAJARAN : ${mapel}
        BAB : ${bab}
        
        A. IDENTITAS MODUL
        (Isi: Nama Sekolah, Penyusun, Mapel, Kelas/Fase/Semester, Alokasi Waktu, Tahun Pelajaran)
        
        B. IDENTIFIKASI KESIAPAN PESERTA DIDIK
        (Isi: Pengetahuan Awal, Minat, Latar Belakang, Kebutuhan Belajar Visual/Auditori/Kinestetik)
        
        C. KARAKTERISTIK MATERI PELAJARAN
        (Isi: Jenis Pengetahuan, Relevansi Kehidupan, Tingkat Kesulitan, Struktur Materi, Integrasi Nilai Karakter)
        
        D. DIMENSI PROFIL LULUSAN
        (Jelaskan dimensinya)
        
        DESAIN PEMBELAJARAN
        A. CAPAIAN PEMBELAJARAN (CP)
        B. LINTAS DISIPLIN ILMU
        C. TUJUAN PEMBELAJARAN
        D. TOPIK PEMBELAJARAN KONTEKSTUAL
        E. KERANGKA PEMBELAJARAN
        F. LANGKAH-LANGKAH PEMBELAJARAN BERDIFERENSIASI
        G. ASESMEN PEMBELAJARAN
        H. LAMPIRAN (KHUSUS GURU) (Isi: 1. LKPD, 2. Rubrik Penilaian, 3. Pengayaan & Remedial, 4. Bahan Bacaan, 5. Glosarium, 6. Daftar Pustaka).
        
        Mengetahui,
        Kepala Sekolah
        ..........................................
        NIP. ................................
         | ..........., ......................... 20..
        Guru Mata Pelajaran
        ..........................................
        NIP. ................................`;

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "Koneksi ditolak oleh API.");
            }

            const data = await response.json();
            const generatedText = data.candidates[0].content.parts[0].text;
            let formattedText = generatedText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

            resultBox.innerHTML = formattedText;
            outputSection.style.display = "block";

        } catch (error) {
            alert(`GAGAL TERHUBUNG!\n\nJika Anda memakai HP Android, browser memblokir koneksi internet dari file lokal.\n\nSOLUSI:\n1. Buka file ini menggunakan Laptop/PC.\n2. ATAU salin kode HTML ini dan jalankan di web seperti jsfiddle.net atau codepen.io dari HP Anda.\n\nDetail Error: ${error.message}`);
        } finally {
            btn.disabled = false;
            btn.innerText = "Mulai Pembuatan Modul (AI Berpikir...)";
            loader.style.display = "none";
        }
    }

    function copyResult() {
        const resultBox = document.getElementById("resultBox");
        const range = document.createRange();
        range.selectNodeContents(resultBox);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        
        try {
            document.execCommand('copy');
            sel.removeAllRanges();
            alert("Modul Ajar berhasil disalin! Silakan Paste (Tempel) di Microsoft Word.");
        } catch(err) {
            alert("Gagal menyalin otomatis. Silakan blok seluruh teks dan salin manual.");
        }
    }
</script>

</body>
</html>
